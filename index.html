
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GreenScape | Beautiful Nature</title>

  <meta name="description" content="GreenScape by Shahriar Ahsan Samy — Discover the beauty of nature through photography.">

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      background: #e9f5df;
    }

    /* HOME HERO */

    .home-hero {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(8, 20, 12, 0.22),
          rgba(8, 20, 12, 0.08),
          rgba(8, 20, 12, 0.20)
        ),
        url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2400&q=90");

      background-size: cover;
      background-position: center;
    }

    /* NAVBAR */

    .navbar {
      position: absolute;
      top: 20px;
      left: 2%;
      width: 96%;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 25px;

      background: rgba(10, 25, 17, 0.68);
      border: 1px solid rgba(190, 255, 205, 0.45);
      border-radius: 60px;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo {
      text-decoration: none;
      color: #d6ffb9;

      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;

      white-space: nowrap;
    }

    .logo span {
      color: #83e86b;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-links a {
      display: block;
      text-decoration: none;
      color: #ffffff;

      font-size: 15px;
      font-weight: 500;

      padding: 11px 16px;
      border-radius: 50px;

      transition: 0.3s ease;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(110, 224, 100, 0.22);
      border: 1px solid rgba(200, 255, 200, 0.85);
      box-shadow: 0 0 18px rgba(140, 255, 130, 0.32);
      color: #d9ffbd;
      transform: translateY(-1px);
    }

    /* MOBILE MENU BUTTON */

    .menu-btn {
      display: none;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.10);
      color: white;

      width: 44px;
      height: 44px;
      border-radius: 50%;

      font-size: 22px;
      cursor: pointer;
    }

    /* HERO TEXT */

    .hero-content {
      width: 100%;
      text-align: center;
      padding: 130px 20px 70px;
      animation: heroFade 1.2s ease both;
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 9vw, 120px);
      font-weight: 600;
      line-height: 1.1;

      color: #ffffff;
      text-shadow: 0 5px 30px rgba(0,0,0,0.24);

      margin-bottom: 35px;
    }

    .hero-content h1 span {
      color: #c8ff91;
    }

    /* EXPLORE BUTTON */

    .explore-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 17px 35px;

      text-decoration: none;
      color: #173c21;

      background: linear-gradient(135deg, #d7ffad, #8fe76c);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 50px;

      font-size: 17px;
      font-weight: 700;

      box-shadow: 0 0 24px rgba(178, 255, 135, 0.38);

      transition: transform 0.35s ease,
                  box-shadow 0.35s ease,
                  background 0.35s ease;
    }

    .explore-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 35px rgba(205,255,160,0.65);
    }

    .explore-btn .arrow {
      font-size: 22px;
      transition: transform 0.3s ease;
    }

    .explore-btn:hover .arrow {
      transform: translateX(5px);
    }

    /* ANIMATION */

    @keyframes heroFade {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TABLET */

    @media (max-width: 1050px) {
      .navbar {
        padding: 12px 18px;
      }

      .logo {
        font-size: 25px;
      }

      .nav-links a {
        padding: 10px 12px;
        font-size: 13px;
      }
    }

    /* MOBILE */

    @media (max-width: 760px) {
      .navbar {
        top: 12px;
        left: 3%;
        width: 94%;
        border-radius: 25px;
        padding: 12px 16px;
      }

      .logo {
        font-size: 24px;
      }

      .menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-links {
        display: none;
        position: absolute;

        top: calc(100% + 10px);
        left: 0;
        width: 100%;

        flex-direction: column;
        align-items: stretch;
        gap: 6px;

        padding: 14px;

        background: rgba(7, 22, 13, 0.94);
        border: 1px solid rgba(190,255,205,0.38);
        border-radius: 24px;

        backdrop-filter: blur(15px);
      }

      .nav-links.open {
        display: flex;
        animation: heroFade 0.25s ease;
      }

      .nav-links a {
        text-align: center;
        font-size: 15px;
        padding: 13px;
      }

      .hero-content {
        padding: 120px 18px 50px;
      }

      .hero-content h1 {
        font-size: clamp(48px, 13vw, 76px);
        margin-bottom: 28px;
      }

      .explore-btn {
        padding: 15px 27px;
        font-size: 15px;
      }

      .home-hero {
        background-position: center;
      }
    }

    @media (max-width: 380px) {
      .logo {
        font-size: 21px;
      }

      .hero-content h1 {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

  <!-- HOME PAGE -->
  <section class="home-hero">

    <!-- NAVIGATION -->
    <nav class="navbar">

      <a href="index.html" class="logo">
        Green<span>Scape</span>
      </a>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        ☰
      </button>

      <ul class="nav-links" id="navLinks">

        <li>
          <a href="index.html" class="active">Home</a>
        </li>

        <li>
          <a href="explore.html">Explore Nature</a>
        </li>

        <li>
          <a href="world-nature.html">World Nature</a>
        </li>

        <li>
          <a href="my-photography.html">My Photography</a>
        </li>

        <li>
          <a href="about.html">About Me</a>
        </li>

        <li>
          <a href="contact.html">Contact</a>
        </li>

      </ul>
    </nav>

    <!-- MAIN HERO CONTENT -->
    <div class="hero-content">

      <h1>
        Beautiful <span>Nature</span>
      </h1>

      <a href="explore.html" class="explore-btn">
        Explore Nature
        <span class="arrow">→</span>
      </a>

    </div>

  </section>

  <!-- MOBILE MENU SCRIPT -->
  <script>
    const menuBtn = document.getElementById("menuBtn");
    const navLinks = document.getElementById("navLinks");

    menuBtn.addEventListener("click", function () {
      navLinks.classList.toggle("open");

      menuBtn.innerHTML = navLinks.classList.contains("open")
        ? "✕"
        : "☰";
    });

    navLinks.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        navLinks.classList.remove("open");
        menuBtn.innerHTML = "☰";
      });
    });
  </script>

</body>
</html>
